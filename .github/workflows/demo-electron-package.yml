name: Demo Electron Package

on:
  push:
    branches:
      - main
    paths:
      - "demo/package.json"
      - "demo/**"
      - ".github/workflows/demo-electron-package.yml"

jobs:
  detect-version-change:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      current_version: ${{ steps.check.outputs.current_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check demo version change
        id: check
        shell: bash
        run: |
          CURRENT_VERSION=$(node -p "require('./demo/package.json').version")
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            PREVIOUS_VERSION=$(git show HEAD^:demo/package.json 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).version||'');}catch{console.log('');}})")
          else
            PREVIOUS_VERSION=""
          fi

          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed: '$PREVIOUS_VERSION' -> '$CURRENT_VERSION'"
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged: '$CURRENT_VERSION'"
          fi

  package:
    needs: detect-version-change
    if: needs.detect-version-change.outputs.version_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: demo-win
          - os: macos-latest
            artifact_name: demo-mac
          - os: ubuntu-latest
            artifact_name: demo-linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: demo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: demo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-v${{ needs.detect-version-change.outputs.current_version }}
          path: demo/dist/**
